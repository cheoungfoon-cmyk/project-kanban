{time:'2026-06-11 21:05',title:'今日 Delay 事项逐项消化',items:['闲鱼估值：材料已给到数科；咸鱼/车e估合同签署已完成。','金融贷中：九音仍在与客户沟通，不计入今日 Delay。','车车科技保险合作：材料发送确认已完成。','昆仑网电：存取/合作方案预计约15天完成，由张欢负责撰写。','汇隆思：价格可能需要调整，需先与领导沟通。','ETC：合同仍在审核中。','充电桩金融：本周已完成会议，后续由对方约客户再沟通。']}
];
let filter='全部', query='', active=0;
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function visible(){return projects.filter(p=>(filter==='全部'||p.level===filter||(filter==='风险'&&(p.status.includes('风险')||p.risk.includes('风险')))||(filter==='暂停'&&(p.status.includes('暂')||p.next.includes('暂')))) && JSON.stringify(p).toLowerCase().includes(query.toLowerCase()))}
function tag(t,cls=''){return `<span class="tag ${cls}">${esc(t)}</span>`}
function renderStats(){const counts={total:projects.length,p0:projects.filter(p=>p.level==='P0').length,p1:projects.filter(p=>p.level==='P1').length,p2:projects.filter(p=>p.level==='P2').length,risk:projects.filter(p=>p.status.includes('风险')||p.risk.includes('风险')).length}; $('#stats').innerHTML=`<div class="stat"><span>项目总数</span><b>${counts.total}</b></div><div class="stat"><span>P0</span><b>${counts.p0}</b></div><div class="stat"><span>P1</span><b>${counts.p1}</b></div><div class="stat"><span>P2</span><b>${counts.p2}</b></div><div class="stat"><span>风险相关</span><b>${counts.risk}</b></div>`}
function renderToday(){ $('#todayGrid').innerHTML=Object.entries(today).map(([k,items])=>`<div class="block"><h4>${esc(k)}</h4><ul>${items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')}
function renderList(){const list=visible(); if(!list[active]) active=0; $('#projectList').innerHTML=list.map((p,i)=>`<div class="project ${i===active?'active':''}" onclick="active=${i};renderList()"><div class="projectTop"><h4>${esc(p.title)}</h4>${tag(p.level,p.level.toLowerCase())}</div><div class="meta">${tag(p.status,p.status.includes('风险')?'risk':'')}${tag(p.owner)}${tag(p.updated)}</div><p>${esc(p.progress)}</p></div>`).join('')||'<div class="block muted">没有匹配项目</div>'; const p=list[active]||projects[0]; $('#detail').innerHTML=`<h3>${esc(p.title)}</h3><div class="detailBody"><div class="meta">${tag(p.level,p.level.toLowerCase())}${tag(p.status)}${tag(p.owner)}${tag(p.updated)}</div><div class="field"><b>合作方</b><p>${esc(p.partners)}</p></div><div class="field"><b>当前阶段</b><p>${esc(p.stage)}</p></div><div class="field"><b>最新进展</b><p>${esc(p.progress)}</p></div><div class="field"><b>当前风险</b><p>${esc(p.risk)}</p></div><div class="field"><b>下一步动作</b><p>${esc(p.next)}</p></div></div>`}
function renderLogs(){ $('#logList').innerHTML=logs.map(l=>`<div class="logItem"><h4>${esc(l.time)} · ${esc(l.title)}</h4><ul>${l.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')}
$$('.filter button').forEach(b=>b.onclick=()=>{$$('.filter button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;active=0;renderList()}); $('#search').oninput=e=>{query=e.target.value;active=0;renderList()}; renderStats();renderToday();renderList();renderLogs();
</script>
</body>
