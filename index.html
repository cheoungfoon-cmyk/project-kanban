<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>项目整体看板</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"></div>
          <div>
            <h1>项目整体看板</h1>
            <p id="rootPath"></p>
          </div>
        </div>
        <nav class="main-menu" aria-label="主菜单">
          <button class="menu-item active" data-view="overview">整体看板</button>
          <button class="menu-item" data-view="projects">单项目</button>
          <button class="menu-item" data-view="weekly">周报</button>
          <button class="menu-item" data-view="logs">每日工作日志</button>
          <button class="menu-item" data-view="team">人员管理</button>
        </nav>
        <label class="search">
          <span>搜索</span>
          <input id="searchInput" type="search" placeholder="项目、风险、下一步">
        </label>
        <div class="filters" role="group" aria-label="项目筛选">
          <button class="filter active" data-filter="all">全部</button>
          <button class="filter" data-filter="P0">P0</button>
          <button class="filter" data-filter="P1">P1</button>
          <button class="filter" data-filter="风险">风险</button>
        </div>
        <div id="sideList" class="project-nav" aria-label="当前视图列表"></div>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">本地 Markdown 工作区</p>
            <h2>项目推进看板</h2>
          </div>
          <div class="stats" id="stats"></div>
        </header>

        <section id="viewRoot"></section>
      </section>
    </main>
    <script src="app.js" type="module"></script>
  </body>
</html>
